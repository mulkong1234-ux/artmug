<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="no-referrer">
<title>물콩씨 버추얼 커미션</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap');
:root{
  --bg:#0b0b0d;
  --card:#141418;
  --panel:#1c1c22;
  --line:rgba(255,255,255,.12);
  --text:#ececf1;
  --sub:#9b9ba8;
  --accent:#f1f1f4;        /* 강조(버튼/숫자) */
  --on-accent:#0b0b0d;
  --accent-grad:linear-gradient(135deg,#ffffff 0%,#c9c9d2 100%);
  --max:960px;
}
*,*::before,*::after{box-sizing:border-box;}
html,body{margin:0;padding:0;max-width:100%;overflow-x:hidden;}
h1,h2,h3,h4,p{margin:0;}
body{
  font-family:'Noto Sans KR','Pretendard','Malgun Gothic',-apple-system,sans-serif;
  font-size:19px;color:var(--text);background:var(--bg);
  line-height:1.8;word-break:keep-all;position:relative;
}
body::before{content:'';position:fixed;top:-160px;right:-140px;width:480px;height:480px;
  background:radial-gradient(circle,rgba(255,255,255,.07) 0%,transparent 70%);pointer-events:none;z-index:0;}
body::after{content:'';position:fixed;bottom:-180px;left:-140px;width:460px;height:460px;
  background:radial-gradient(circle,rgba(255,255,255,.05) 0%,transparent 70%);pointer-events:none;z-index:0;}
img{max-width:100%;display:block;-webkit-user-drag:none;}
a{color:inherit;}
.page{max-width:var(--max);margin:0 auto;padding:36px 20px 70px;position:relative;z-index:1;}
.section{background:var(--card);border:1px solid var(--line);border-radius:26px;padding:32px 34px;margin-bottom:20px;}
.section-head{display:flex;align-items:center;gap:14px;margin-bottom:22px;}
.section-icon{width:5px;height:26px;border-radius:4px;background:var(--accent-grad);flex-shrink:0;}
.section-title{font-family:'Noto Sans KR','Pretendard','Malgun Gothic',sans-serif;font-size:30px;font-weight:400;color:var(--accent);}
.is-hidden{display:none !important;}

/* HERO */
.hero{position:relative;overflow:hidden;background:linear-gradient(150deg,#26262d 0%,#111114 100%);
  border:1px solid var(--line);border-radius:30px;padding:50px 38px;margin-bottom:20px;}
.hero-blob{position:absolute;border-radius:50%;pointer-events:none;}
.hero-blob.b1{width:260px;height:260px;top:-120px;right:-70px;background:rgba(255,255,255,.06);}
.hero-blob.b2{width:220px;height:220px;bottom:-120px;left:-60px;background:rgba(255,255,255,.04);}
.hero-inner{position:relative;z-index:1;}
.hero-badge{display:inline-flex;font-size:12px;font-weight:500;letter-spacing:.06em;background:rgba(255,255,255,.08);
  border:1px solid var(--line);color:var(--accent);padding:6px 16px;border-radius:999px;margin-bottom:16px;}
.hero h1{font-family:'Noto Sans KR','Pretendard','Malgun Gothic',sans-serif;font-size:clamp(34px,4.8vw,48px);font-weight:400;line-height:1.5;margin:0 0 14px;color:#fff;}
.hero p{font-size:19px;color:var(--sub);max-width:560px;margin:0 0 20px;}
.hero-tags{display:flex;gap:8px;flex-wrap:wrap;}
.hero-tag{background:rgba(255,255,255,.08);border:1px solid var(--line);padding:10px 14px 5px;border-radius:999px;font-size:15.5px;font-weight:500;color:var(--accent);line-height:1;}

/* 작업순서 */
.flow + .flow{margin-top:22px;}
.flow-label{font-size:16px;color:var(--sub);margin-bottom:10px;}
.process-track{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;}
.process-step{background:var(--panel);border:1.5px solid var(--line);border-radius:16px;padding:18px 8px;text-align:center;}
.process-num{width:40px;height:40px;border-radius:50%;margin:0 auto 10px;background:var(--accent-grad);color:var(--on-accent);
  display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:500;}
.process-label{font-size:15px;font-weight:500;line-height:1.5;}

/* 가격표 */
.price-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;}
.price-card{background:var(--panel);border:1.5px solid var(--line);border-radius:16px;padding:16px 20px;display:flex;flex-direction:column;gap:2px;}
.price-card b{font-family:'Noto Sans KR','Pretendard','Malgun Gothic',sans-serif;font-size:18px;font-weight:400;}
.price-card .price{font-size:22px;color:var(--accent);font-weight:500;}
.price-card .days{font-size:14px;color:var(--sub);}
.price-card .memo{font-size:13.5px;color:var(--sub);}
.sub-title{font-family:'Noto Sans KR','Pretendard','Malgun Gothic',sans-serif;font-size:20px;margin:26px 0 12px;color:var(--accent);}
.opt-list{display:flex;flex-direction:column;}
.opt-row{display:flex;justify-content:space-between;gap:14px;padding:10px 2px;border-bottom:1px solid var(--line);font-size:15.5px;}
.opt-row:last-child{border-bottom:none;}
.opt-row span:last-child{color:var(--accent);font-weight:500;white-space:nowrap;}

/* 안내(정책) */
.policy-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;}
.policy{background:var(--panel);border:1.5px solid var(--line);border-radius:16px;padding:16px 20px;}
.policy h3{font-family:'Noto Sans KR','Pretendard','Malgun Gothic',sans-serif;font-size:18px;font-weight:400;color:var(--accent);margin-bottom:6px;}
.policy p{font-size:14.5px;color:var(--text);line-height:1.8;}
.policy p + p{margin-top:4px;}
.policy.wide{grid-column:1 / -1;}

/* 링크/협업 */
.link-list{display:flex;gap:10px;flex-wrap:wrap;}
.link-btn{display:inline-block;text-decoration:none;background:var(--accent-grad);color:var(--on-accent);
  padding:12px 22px 9px;border-radius:999px;font-size:15.5px;font-weight:500;}
.link-btn:hover{filter:brightness(.92);}
.collab-grid{display:flex;flex-wrap:wrap;justify-content:center;gap:18px;}
.collab-card{width:min(100%,420px);display:flex;flex-direction:column;align-items:center;text-align:center;text-decoration:none;background:var(--panel);border:1.5px solid var(--line);border-radius:20px;padding:40px 28px 32px;transition:.15s;}
.collab-card:hover{border-color:var(--accent);transform:translateY(-2px);}
.collab-thumb{width:160px;height:160px;border-radius:50%;background:#25252c;display:flex;align-items:center;justify-content:center;overflow:hidden;border:2px solid var(--line);margin-bottom:20px;}
.collab-thumb img{width:100%;height:100%;object-fit:cover;}
.collab-thumb span{font-family:'Noto Sans KR','Pretendard','Malgun Gothic',sans-serif;font-size:40px;color:var(--sub);}
.collab-name{font-size:24px;font-weight:500;line-height:1.4;}
.collab-desc{font-size:16px;color:var(--sub);margin-top:2px;line-height:1.5;}
.collab-note-in{font-size:16px;color:var(--text);line-height:1.7;margin-top:18px;padding-top:18px;border-top:1px dashed var(--line);width:100%;}
.collab-go{margin-top:22px;background:var(--accent-grad);color:var(--on-accent);font-size:16px;font-weight:500;padding:12px 28px 9px;border-radius:999px;}
.collab-note{font-size:14.5px;color:var(--sub);margin-top:12px;}

/* 갤러리 */
.gallery-tabs{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:20px;}
.gallery-tab{font-family:inherit;font-size:16px;font-weight:500;color:var(--sub);background:var(--panel);border:1.5px solid var(--line);
  padding:11px 22px 8px;border-radius:999px;cursor:pointer;transition:.15s;display:inline-flex;align-items:center;gap:8px;line-height:1.2;}
.gallery-tab em{font-style:normal;font-size:12.5px;opacity:.7;}
.gallery-tab:hover{color:var(--text);border-color:var(--accent);}
.gallery-tab.active{background:var(--accent);color:var(--on-accent);border-color:var(--accent);}
.gallery-body{min-height:120px;}
.gallery-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
.gallery-item{margin:0;position:relative;aspect-ratio:4/3;border-radius:16px;overflow:hidden;background:#1f1f25;border:1px solid var(--line);cursor:zoom-in;}
.gallery-item img{width:100%;height:100%;object-fit:cover;object-position:center top;display:block;transition:transform .35s ease;}
.gallery-item::after{content:'';position:absolute;inset:0;border-radius:16px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.04);pointer-events:none;}
.gallery-item:hover img{transform:scale(1.05);}

/* 주문서 */
.form-note-box{background:var(--panel);padding:16px 20px;border-radius:16px;font-size:14.5px;color:var(--sub);line-height:1.75;margin-bottom:22px;text-align:center;}
.form-grid{display:flex;flex-direction:column;gap:20px;}
.form-label{display:block;font-size:15.5px;font-weight:500;color:var(--accent);margin-bottom:8px;}
.form-label .opt{font-weight:400;color:var(--sub);}
.select-btns{display:flex;gap:8px;flex-wrap:wrap;}
.select-btn{padding:9px 18px 7px;border-radius:999px;border:1.5px solid var(--line);background:var(--panel);
  font-family:inherit;font-size:15px;font-weight:500;color:var(--sub);cursor:pointer;transition:.15s;}
.select-btn small{font-size:12px;opacity:.8;margin-left:4px;}
.select-btn:hover{border-color:var(--accent);color:var(--text);}
.select-btn.active{background:var(--accent);color:var(--on-accent);border-color:var(--accent);}
.qty-btn{display:inline-flex;align-items:center;gap:10px;padding:6px 8px 4px 18px;border-radius:999px;border:1.5px solid var(--line);background:var(--panel);font-size:15px;font-weight:500;color:var(--sub);}
.qty-btn.active{color:var(--accent);border-color:var(--accent);}
.qty-controls{display:flex;align-items:center;gap:6px;}
.qty-count{min-width:16px;text-align:center;font-weight:500;color:var(--accent);}
.qty-step{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);background:var(--card);cursor:pointer;font-size:13px;font-weight:500;color:var(--accent);display:flex;align-items:center;justify-content:center;padding:0;font-family:inherit;}
.qty-step:hover{background:var(--bg);}
.form-input{width:100%;border:1.5px solid var(--line);border-radius:14px;background:var(--panel);padding:12px 16px;font-family:inherit;font-size:15px;color:var(--text);outline:none;}
.form-input:focus{border-color:var(--accent);}
.form-input::placeholder{color:#6d6d79;}
textarea.form-input{min-height:110px;resize:vertical;line-height:1.7;}
#form-preview{white-space:pre-wrap;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 20px;font-size:15px;margin-top:22px;line-height:1.9;}
.form-agree{display:flex;align-items:center;gap:9px;margin-top:18px;font-size:14px;}
.form-agree input{accent-color:#fff;}
.form-button-row{display:flex;gap:10px;margin-top:14px;}
.btn-wrap{position:relative;flex:1;}
.btn-wrap-sm{position:relative;flex:0 0 96px;}
.form-submit{width:100%;padding:16px 10px 13px;border:none;border-radius:16px;background:#2a2a31;color:#6d6d79;font-family:inherit;font-size:15.5px;font-weight:500;cursor:not-allowed;transition:.2s;}
.form-submit.enabled{background:var(--accent-grad);color:var(--on-accent);cursor:pointer;}
.form-submit.enabled:hover{filter:brightness(.93);}
.form-reset{width:100%;padding:16px 10px 13px;border:1.5px solid var(--line);border-radius:16px;background:transparent;color:var(--sub);font-family:inherit;font-size:14px;font-weight:500;cursor:pointer;}
.form-reset:hover{background:var(--panel);color:var(--accent);}
.form-toast{position:absolute;bottom:calc(100% + 10px);left:50%;transform:translateX(-50%) translateY(6px);background:#fff;color:#000;padding:8px 16px 6px;border-radius:10px;font-size:12.5px;font-weight:500;white-space:nowrap;opacity:0;pointer-events:none;transition:.25s;z-index:6;}
.form-toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:50;display:none;align-items:center;justify-content:center;padding:20px;cursor:zoom-out;}
.lightbox.open{display:flex;}
.lightbox img{max-width:100%;max-height:100%;border-radius:12px;object-fit:contain;}

@media (max-width:820px){
  .page{padding:26px 16px 56px;}
  .section{padding:24px 20px;border-radius:22px;}
  .hero{padding:34px 22px;border-radius:24px;}
}
@media (max-width:560px){
  .price-grid,.policy-grid{grid-template-columns:1fr;}
  .gallery-grid{grid-template-columns:repeat(2,1fr);gap:8px;}
  .gallery-tab{font-size:14.5px;padding:9px 16px 6px;}
  .section-title{font-size:26px;}
  .process-label{font-size:13px;}
}
.section-title,.hero h1,.price-card b,.policy h3,.sub-title,.collab-name{font-weight:700;}
.price-card .price{font-weight:700;}
body{font-size:17px;letter-spacing:-.01em;}
</style>
</head>
<body>
<div class="page">

<header class="hero">
  <div class="hero-blob b1"></div><div class="hero-blob b2"></div>
  <div class="hero-inner">
    <span class="hero-badge" data-t="badge"></span>
    <h1 id="hero-title"></h1>
    <p id="hero-desc"></p>
    <div class="hero-tags" id="hero-tags"></div>
  </div>
</header>

<section class="section" id="progress">
  <div class="section-head"><div class="section-icon"></div><div class="section-title" data-t="sec_progress"></div></div>
  <div class="policy-grid" id="progress-grid"></div>
</section>

<section class="section" id="gallery">
  <div class="section-head"><div class="section-icon"></div><div class="section-title" data-t="sec_gallery"></div></div>
  <div id="gallery-groups"></div>
</section>

<section class="section" id="price">
  <div class="section-head"><div class="section-icon"></div><div class="section-title" data-t="sec_price"></div></div>
  <div class="price-grid" id="price-grid"></div>
  <div id="option-lists"></div>
</section>

<section class="section" id="process">
  <div class="section-head"><div class="section-icon"></div><div class="section-title" data-t="sec_process"></div></div>
  <div id="process-wrap"></div>
</section>

<section class="section" id="notice">
  <div class="section-head"><div class="section-icon"></div><div class="section-title" data-t="sec_notice"></div></div>
  <div class="policy-grid" id="policy-grid"></div>
</section>

<section class="section" id="form">
  <div class="section-head"><div class="section-icon"></div><div class="section-title" data-t="sec_form"></div></div>
  <div class="form-note-box" data-t="form_note"></div>
  <div class="form-grid">
    <div><span class="form-label" data-t="lbl_type"></span><div class="select-btns" id="of-type-group"></div></div>
    <div><span class="form-label" data-t="lbl_rush"></span><div class="select-btns" id="of-rush-group"></div></div>
    <div><span class="form-label" data-t="lbl_port"></span><div class="select-btns" id="of-port-group"></div></div>
    <div><span class="form-label"><span data-t="lbl_extra"></span> <span class="opt" data-t="lbl_multi"></span></span><div class="select-btns" id="of-extra-group"></div></div>
    <div><label class="form-label" for="of-memo"><span data-t="lbl_memo"></span> <span class="opt" data-t="lbl_optional"></span></label>
      <textarea class="form-input" id="of-memo" data-tp="ph_memo"></textarea></div>
  </div>
  <div id="form-preview"></div>
  <label class="form-agree"><input type="checkbox" id="of-agree"><span data-t="agree"></span></label>
  <div class="form-button-row">
    <div class="btn-wrap"><div class="form-toast" id="of-status" data-t="copied"></div><button type="button" class="form-submit" id="of-submit" data-t="btn_copy"></button></div>
    <div class="btn-wrap-sm"><div class="form-toast" id="of-reset-status" data-t="reset_done"></div><button type="button" class="form-reset" id="of-reset" data-t="btn_reset"></button></div>
  </div>
</section>

<section class="section" id="collab">
  <div class="section-head"><div class="section-icon"></div><div class="section-title" data-t="sec_collab"></div></div>
  <div class="collab-grid" id="collab-list"></div>
  <p class="collab-note is-hidden" id="collab-note"></p>
</section>

</div>
<div class="lightbox" id="lightbox"><img alt=""></div>

<script>
/* =====================================================================
   구글 시트 연동 페이지
   - 아래 SHEET_ID 만 본인 시트 ID로 바꾸면 끝.
   - 시트 탭 이름(정확히 동일): 기본 / 타입 / 이미지 / 주문옵션 / 문구
   - 시트는 "링크가 있는 모든 사용자 - 뷰어"로 공유. 못 읽으면 아래 기본값이 그대로 보임.
   ===================================================================== */

  ['복사 내용 - 빠른 마감','out_rush','빠른 마감'],
  ['복사 내용 - 포폴 옵션','out_port','포폴 옵션'],

  ['복사 내용 - 작업기간','out_days','작업기간'],

/* 구글 드라이브 링크 → 이미지 주소 */
function driveId(u){
  const m = u.match(/drive\.google\.com\/(?:file\/(?:u\/\d+\/)?d|drive\/(?:u\/\d+\/)?files|d)\/([\w-]{10,})/)
         || u.match(/(?:drive|docs)\.google\.com\/(?:open|uc|thumbnail)\?(?:[^#]*&)?id=([\w-]{10,})/)
         || u.match(/lh3\.googleusercontent\.com\/d\/([\w-]{10,})/);
  return m ? m[1] : '';
}
function imgCandidates(u){
  u = String(u || '').trim();
  if(/drive\.google\.com\/drive\/(?:u\/\d+\/)?folders/.test(u)) return [];
  const id = driveId(u);
  if(id) return ['https://lh3.googleusercontent.com/d/'+id+'=w1600','https://drive.google.com/thumbnail?id='+id+'&sz=w1600','https://drive.google.com/uc?export=view&id='+id];
  return /^https?:\/\//i.test(u) ? [u] : [];
}
let galleryCat = '', galleryTok = 0;
const imgInfo = {};   /* 주소 -> {src,w,h} 또는 null(실패) */
function probeImage(url){
  if(url in imgInfo) return Promise.resolve(imgInfo[url]);
  const c = imgCandidates(url);
  return new Promise(res => {
    let k = 0;
    const im = new Image(); im.referrerPolicy = 'no-referrer';
    im.onload = () => { imgInfo[url] = { src:im.src, w:im.naturalWidth || 1, h:im.naturalHeight || 1 }; res(imgInfo[url]); };
    im.onerror = () => { if(++k < c.length) im.src = c[k]; else { imgInfo[url] = null; res(null); } };
    im.src = c[0];
  });
}
function renderGallery(){
  const w = $('gallery-groups'); w.textContent = '';
  const imgs = DATA.images.filter(r => imgCandidates(r.url).length);
  $('gallery').classList.toggle('is-hidden', !imgs.length && !DATA.links.length);
  if(!imgs.length) return;
  const names = [...new Set(imgs.map(r => r.type))];
  if(!names.includes(galleryCat)) galleryCat = names[0];
  const tabs = el('div','gallery-tabs');
  names.forEach(n => {
    const b = el('button','gallery-tab' + (n === galleryCat ? ' active' : ''), n); b.type = 'button';
    b.addEventListener('click', () => { galleryCat = n; renderGallery(); });
    tabs.appendChild(b);
  });
  w.appendChild(tabs);
  const body = el('div','gallery-body'); w.appendChild(body);
  const tok = ++galleryTok;
  Promise.all(imgs.filter(r => r.type === galleryCat).map(r => probeImage(r.url))).then(list => {
    if(tok !== galleryTok) return;
    galleryItems = list.filter(Boolean);
    layoutGallery();
  });
}
/* 같은 크기로 잘라서 정렬 (한눈에 보이게) */
let galleryItems = [];
function layoutGallery(){
  const body = document.querySelector('.gallery-body'); if(!body) return;

  const grid = el('div','gallery-grid'); grid.setAttribute('data-lightbox',''); body.appendChild(grid);

    fig.appendChild(im); grid.appendChild(fig);
  });
}

      eg.appendChild(wrap);
    } else {
      eg.appendChild(chip(e.name, sub, !!state.extras[e.name], () => { state.extras[e.name] = state.extras[e.name] ? 0 : 1; renderForm(); }));
    }
  });
  preview();
}
function preview(){
  if(!DATA.types.length){ $('form-preview').textContent = ''; return; }
  const t = DATA.types[state.type];
  let total = t.price;
  const rush = curOpts('마감')[state.rush]; if(rush) total += rush.add;
  const port = DATA.opts.filter(o => o.group === '포폴')[state.port]; if(port) total += port.add;
  const ex = [];
  curOpts('추가옵션').forEach(e => { const q = state.extras[e.name] || 0; if(q > 0){ total += e.add * q; ex.push(e.max > 1 ? e.name+' '+TXT.times+q : e.name); } });
  const memo = $('of-memo').value.trim();
  $('form-preview').textContent =
`${TXT.out_title}

${TXT.out_type} : ${t.name}
${TXT.out_days} : ${t.days || '-'}
${TXT.out_rush} : ${rush ? rush.name : TXT.out_none}
${TXT.out_port} : ${port ? port.name : TXT.out_none}
${TXT.out_extra} : ${ex.length ? ex.join(', ') : TXT.out_none}
${TXT.out_memo} : ${memo || TXT.out_empty}
${TXT.out_total} : ${fmt(total)}${TXT.won}`;
}
function flash(id){ const e = $(id); e.classList.add('show'); setTimeout(() => e.classList.remove('show'), 1800); }
$('of-memo').addEventListener('input', preview);
$('of-agree').addEventListener('change', () => $('of-submit').classList.toggle('enabled', $('of-agree').checked));
$('of-submit').addEventListener('click', (e) => {
  if(!e.currentTarget.classList.contains('enabled')) return;
  const text = $('form-preview').textContent;
  if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(() => flash('of-status')).catch(() => {}); }
  else { const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select(); try{ document.execCommand('copy'); flash('of-status'); }catch(err){} ta.remove(); }
});
$('of-reset').addEventListener('click', () => {
  state.type = 0; state.rush = -1; state.port = 0; state.extras = {};
  $('of-memo').value = ''; $('of-agree').checked = false; $('of-submit').classList.remove('enabled');
  renderForm(); flash('of-reset-status');
});

/* ---- 구글 시트 읽기 ---- */
function parseCsv(text){
  const rows = []; let row = [], field = '', q = false;
  for(let i = 0; i < text.length; i++){
    const c = text[i];
    if(q){ if(c === '"'){ if(text[i+1] === '"'){ field += '"'; i++; } else q = false; } else field += c; }
    else if(c === '"') q = true;
    else if(c === ',') { row.push(field); field = ''; }
    else if(c === '\n') { row.push(field); rows.push(row); row = []; field = ''; }
    else if(c !== '\r') field += c;
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  return rows;
}
function toObjects(rows){
  if(!rows.length) return [];
  const head = rows[0].map(h => String(h).replace(/^﻿/, '').trim());
  return rows.slice(1).filter(r => r.some(c => String(c).trim() !== '')).map(r => {
    const o = {}; head.forEach((h,i) => { o[h] = String(r[i] || '').trim(); }); return o;
  });
}
const num = (v) => { const n = Number(String(v || '').replace(/[^0-9.-]/g, '')); return isNaN(n) ? 0 : n; };
function loadTab(name){
  const url = 'https://docs.google.com/spreadsheets/d/' + SHEET_ID + '/gviz/tq?tqx=out:csv&headers=1&sheet=' + encodeURIComponent(name) + '&_=' + Date.now();
  return fetch(url).then(r => { if(!r.ok) throw new Error('bad'); return r.text(); })
    .then(t => { if(/<html/i.test(t)) throw new Error('not csv'); return toObjects(parseCsv(t)); });
}

function applySheet(basic, types, imgs, opts, texts){
  if(texts.length){
    const by = {}; texts.forEach(r => { if(r['항목']) by[r['항목']] = r['내용']; });
    TEXT_ITEMS.forEach(it => { if(by[it[0]] !== undefined) TXT[it[1]] = by[it[0]]; });
  }
  if(basic.length){
    const g = (k) => basic.filter(r => r['구분'] === k);
    const intro = g('소개')[0];
    if(intro){ if(intro['제목']) DATA.hero.title = intro['제목']; if(intro['내용']) DATA.hero.desc = intro['내용']; }
    const tags = g('태그').filter(r => r['제목']); if(tags.length) DATA.tags = tags.map(r => r['제목']);
    const steps = g('순서').filter(r => r['제목']);
    if(steps.length){
      const flows = [];
      steps.forEach(r => { const lb = r['내용'] || ''; let f = flows.find(x => x.label === lb); if(!f){ f = { label:lb, steps:[] }; flows.push(f); } f.steps.push(r['제목']); });
      DATA.flows = flows;
    }
    const prog = g('진행').filter(r => r['제목'] || r['내용']);
    if(prog.length) DATA.progress = prog.map(r => ({ title:r['제목'], body:r['내용'], wide:String(r['내용']).split('\n').length >= 3 }));
    const pol = g('안내').filter(r => r['제목'] || r['내용']);
    if(pol.length) DATA.policies = pol.map(r => ({ title:r['제목'], body:r['내용'], wide:String(r['내용']).split('\n').length >= 3 }));
    const cb = g('협업').filter(r => r['제목'] && r['내용']); if(cb.length) DATA.collabs = cb.map(r => ({ label:r['제목'], url:r['내용'], img:r['이미지'] || '', desc:r['설명'] || '' }));
    const col = g('협업안내')[0]; if(col) DATA.collab = col['내용'] || '';
  }
  if(types.length){
    DATA.types = types.map(r => ({ name:r['제목'], memo:r['안내문구'] || '', days:r['기간'] || '', price:num(r['금액']), cat:r['분류'] || '' }));
  }
  if(opts.length){
    DATA.opts = opts.filter(r => r['제목']).map(r => ({ group:r['구분'], name:r['제목'], add:num(r['금액']), only:r['대상'] || '', max:num(r['최대수량']), unit:r['단위'] || '' }));
  }
  if(imgs.length) DATA.images = imgs.filter(r => r['타입'] && r['링크']).map(r => ({ type:r['타입'], url:r['링크'] }));
}

/* ---- 드라이브 폴더 → 포트폴리오 ---- */
function loadDrive(){
  if(!DRIVE_SCRIPT_URL) return Promise.resolve();
  return fetch(DRIVE_SCRIPT_URL).then(r => r.json()).then(list => {
    const imgs = [];
    list.forEach(c => c.files.forEach(id => imgs.push({ type:c.category, url:'https://drive.google.com/file/d/' + id + '/view' })));
    if(imgs.length) DATA.images = imgs;
  }).catch(() => {});
}

/* ---- 시작 ---- */
applyTexts(); renderStatic(); renderForm();
if(SHEET_ID && !/^여기에/.test(SHEET_ID)){
  Promise.allSettled(['기본','타입','이미지','주문옵션','문구'].map(loadTab)).then(res => {
    const get = (i) => (res[i].status === 'fulfilled' ? res[i].value : []);
    applySheet(get(0), get(1).filter(r => r['제목']), get(2), get(3), get(4));
    state.type = 0; state.rush = -1; state.port = 0; state.extras = {};
    applyTexts(); renderStatic(); renderForm();
    return loadDrive().then(renderGallery);
  });
} else { loadDrive().then(renderGallery); }

/* 이미지 확대 */
(function(){
  const box = $('lightbox'), big = box.querySelector('img');
  document.addEventListener('click', (e) => {
    const img = e.target.closest && e.target.closest('[data-lightbox] img');
    if(img){ big.src = img.src; big.alt = img.alt; box.classList.add('open'); }
  });
  box.addEventListener('click', () => box.classList.remove('open'));
  document.addEventListener('keydown', (e) => { if(e.key === 'Escape') box.classList.remove('open'); });
})();

/* iframe 임베드 높이 자동조절 */
(function(){
  function h(){ let max = 0; Array.prototype.forEach.call(document.body.children, (c) => { const r = c.getBoundingClientRect(); if(r.bottom > max) max = r.bottom; }); return Math.ceil(max + window.pageYOffset); }
  function send(){ window.parent.postMessage({ type:'iframeResize', height:h() }, '*'); }
  window.addEventListener('load', send); window.addEventListener('resize', send);
  if(window.ResizeObserver){ new ResizeObserver(send).observe(document.body); }
  setInterval(send, 700);
})();
</script>
